services:
  generals-game:
    image: generals-polyworld-game:${GENERALS_ARCH:-amd64}
    platform: linux/${GENERALS_ARCH:-amd64}
    build:
      context: ../..
      dockerfile: integrations/softmax/Dockerfile
      target: polyworld-game
  generals-player:
    image: generals-coworld-player:${GENERALS_ARCH:-amd64}
    platform: linux/${GENERALS_ARCH:-amd64}
    build:
      context: ../..
      dockerfile: integrations/softmax/Dockerfile
      target: player
